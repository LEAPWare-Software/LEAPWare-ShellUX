name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # This repo is public: without an author-association check, any GitHub user
    # could comment "@claude" on an issue or PR and spend the owner's Claude
    # subscription (CLAUDE_CODE_OAUTH_TOKEN) and/or inject prompts into a Claude
    # run with repo-scoped tokens. Restrict triggering to OWNER, MEMBER (org
    # member) or COLLABORATOR (explicitly added). The @claude mention match is
    # unchanged.
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.review.author_association)) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # write: the D-55 follow-up (#211/#227) widened claude_args to allow `gh pr
      # comment`. `read` is not enough for that call to succeed: claude-code-review.yml
      # documents the identical failure (run 35410730035, PR #145, held `read`, denied
      # 14 tool calls, posted nothing) and was fixed the same way.
      pull-requests: write
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # This job now holds pull-requests: write and a gh pr view/diff/comment
          # grant, the same profile claude-code-review.yml carries; without this,
          # the write-scoped job token sits readable in .git/config for the agent's
          # own git/gh tool access to find. D-55 follow-up (#211/#227), decided in
          # docs/decisions/debates/D-55-pr206-bootstrap-gate.md item 3 and missed in
          # this PR's first pass — added per claude[bot]'s review.
          persist-credentials: false

      # D-55 follow-up (#211): claude-code-review.yml already grants gh pr
      # view/diff/comment (line below mirrors its allowlist exactly), but that
      # workflow skips fork PRs outright (D-49). This workflow does not, and an
      # @claude mention can arrive on a fork PR's issue_comment,
      # pull_request_review_comment or pull_request_review. Refuse those before
      # the widened grant is ever used. This is a guardrail (in-repo YAML any
      # writer can edit), not an integrity control; it is entry-point validation
      # at this trigger only, not a claim about any other route. A failed step
      # here halts the job — GitHub Actions runs the next step only on
      # success() by default — so "Run Claude Code" never executes for a
      # refused fork PR.
      - name: Refuse @claude on fork pull requests
        id: fork-guard
        if: >-
          (github.event_name == 'issue_comment' && github.event.issue.pull_request != null) ||
          github.event_name == 'pull_request_review_comment' ||
          github.event_name == 'pull_request_review'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          set -euo pipefail
          HEAD_REPO=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" --jq .head.repo.full_name)
          if [ "$HEAD_REPO" != "${{ github.repository }}" ]; then
            echo "::error::@claude refused on PR #${PR_NUMBER}: head repo '$HEAD_REPO' is not '${{ github.repository }}' (a fork). D-55 follow-up (#211): the gh pr view/diff/comment grant is not extended to fork PRs."
            exit 1
          fi
          echo "PR #${PR_NUMBER} head repo is ${{ github.repository }}; not a fork, proceeding."

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@4036a180cf690f49529f5d8c79c998855287f590 # v1, pinned 2026-09-18: a moving tag would run new third-party code with this repository's tokens on its next push
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # D-55 follow-up (#211/#227): before this line existed, claude_args was
          # unset, so this job ran on the action's own default tool policy.
          # docs/decisions/debates/D-55-pr206-bootstrap-gate.md lists "the
          # pytest-equivalent live run of --allowedTools" under Not measured — so
          # whether an explicit --allowedTools flag replaces that default outright
          # or only adds to it is unverified, not asserted here. Read/Grep/Glob are
          # named here too (not just the three gh pr commands #211 asked for) so
          # that, under either mechanism, a plain "@claude explain this file" issue
          # mention that isn't about a PR at all keeps working.
          # Read/Grep/Glob mirror claude-code-review.yml's own allowlist exactly;
          # its mcp__github_inline_comment__create_inline_comment entry is not
          # carried over, deliberately — that tool posts structured inline PR
          # review comments, a shape this general-purpose mention handler has no
          # prompt asking it to produce, unlike the dedicated reviewer action.
          #
          # The gh pr view/diff/comment tools are granted only for the three event
          # types the fork guard above actually covers (issue_comment on a PR,
          # pull_request_review_comment, pull_request_review); an `issues` mention
          # (opened/assigned) never gets them, because that trigger has no
          # associated PR for the guard to check at all — found by claude[bot]'s
          # review: the guard step's own `if:` already excludes `issues`, but
          # claude_args was granting the tools there anyway, unguarded. This closes
          # that route rather than merely documenting it, since there is no
          # legitimate need for gh pr tools on a plain issue mention.
          #
          # Not closed by this or any static YAML condition, and stated here rather
          # than claimed away: a comment on a same-repo, non-fork PR (which passes
          # the guard, since the *triggering* PR is genuinely not a fork) can still
          # ask, in free text, "@claude also check PR #<fork-PR>" — no `prompt:`
          # override is set, so Claude follows that instruction verbatim, and nothing
          # here stops it from running `gh pr diff <fork-PR>` with a write-scoped
          # token against a PR this guard never evaluated. Closing that route needs
          # either a `prompt:` override constraining every gh pr invocation to the
          # triggering PR's own number (unverified here whether that would also
          # silently replace the action's default "follow the tagging comment's
          # instructions" behavior — not attempted without confirming that first)
          # or dropping free-form gh pr access entirely in favour of a fixed,
          # non-configurable prompt, as claude-code-review.yml already does. Left
          # open, filed as #228 per CLAUDE.md rule 7 rather than left as prose only.
          claude_args: >-
            --allowedTools "${{ ((github.event_name == 'issue_comment' &&
            github.event.issue.pull_request != null) || github.event_name ==
            'pull_request_review_comment' || github.event_name ==
            'pull_request_review') && 'Bash(gh pr view:*),Bash(gh pr
            diff:*),Bash(gh pr comment:*),Read,Grep,Glob' || 'Read,Grep,Glob' }}"

