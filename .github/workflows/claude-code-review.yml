name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Secrets (CLAUDE_CODE_OAUTH_TOKEN included) are not passed to workflow runs
    # triggered from a fork PR, and Dependabot PRs carry no meaningful review
    # surface for this action either — both would otherwise fail this job red
    # on every occurrence. Skip both rather than let them report a false failure.
    if: |
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # write: the plugin posts its verdict with `gh pr comment` and inline comments.
      # Run 35410730035 (PR #145) held `read`, was denied 14 tool calls and posted nothing.
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@4036a180cf690f49529f5d8c79c998855287f590 # v1, pinned 2026-09-18: a moving tag would run new third-party code with this repository's tokens on its next push
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # A direct prompt, not the `code-review` plugin. Three runs of the plugin
          # (35410730035 on #145, 35412804663 on #148, 35415153661 on #150) reported
          # SUCCESS and posted nothing, and its log never says why: the plugin may stop
          # early by design ("does not need review") or be denied a tool, and the two
          # are indistinguishable from outside. This prompt must always end with one
          # summary comment, so a run that posts nothing is visibly a failure. It also
          # drops the plugin marketplace URL, which could not be pinned.
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request adversarially. Read CLAUDE.md and
            docs/adr/0003-quality-over-velocity.md first; they are the rules this
            repository is reviewed against. Use `gh pr view` and `gh pr diff` to read
            the change, and Read/Grep/Glob to read the tree.

            Look for: defects in the code; claims in documentation or the PR body that
            the change does not support (rule 2: evidence, not assertion); security
            wording outside the three permitted terms (integrity control, entry-point
            validation, guardrail); inline suppressions; tests whose names claim more
            than they assert; closing keywords next to issue numbers.

            Post each real, specific finding as an inline comment with
            mcp__github_inline_comment__create_inline_comment (confirmed: true). Then,
            ALWAYS, post exactly one summary with `gh pr comment <number> --body ...`
            that starts with "Claude review:" and lists the findings, or says "No
            findings" and what you checked. Never finish without that summary.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

