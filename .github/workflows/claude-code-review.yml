name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Secrets (CLAUDE_CODE_OAUTH_TOKEN included) are not passed to workflow runs
    # triggered from a fork PR, and Dependabot PRs carry no meaningful review
    # surface for this action either — both would otherwise fail this job red
    # on every occurrence. Skip both rather than let them report a false failure.
    if: |
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # write: the plugin posts its verdict with `gh pr comment` and inline comments.
      # Run 35410730035 (PR #145) held `read`, was denied 14 tool calls and posted nothing.
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@4036a180cf690f49529f5d8c79c998855287f590 # v1, pinned 2026-09-18: a moving tag would run new third-party code with this repository's tokens on its next push
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # Exactly the tools the plugin's own command declares (plugins/code-review/commands/
          # code-review.md, `allowed-tools`), plus read-only file tools for its subagents.
          # With only the inline-comment tool, run 35410730035 was denied 14 calls and
          # reported SUCCESS having posted nothing.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Read,Grep,Glob"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

