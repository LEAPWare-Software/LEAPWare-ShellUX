name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repository. No packages, no deployments,
# no write access to issues or PRs.
permissions:
  contents: read

# One in-flight run per ref. A new push supersedes the previous run instead of
# queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    # Three operating systems, because this project is developed on more than one
    # laptop and cross-platform support was previously *inferred* from the
    # platform-specific optional dependencies in package-lock.json rather than
    # observed. Each leg earns its place by catching something the others cannot:
    #
    #   ubuntu-latest   Case-sensitive filesystem. The only leg that fails on an
    #                   import whose case does not match the file on disk, and the
    #                   reference platform for CRLF regressions.
    #   macos-latest    The darwin-arm64 leg of the lockfile's optional
    #                   dependencies, and the only place a native rollup/esbuild
    #                   binary for that platform is actually executed rather than
    #                   assumed to exist.
    #   windows-latest  Case-insensitive filesystem, a different path separator and
    #                   a different default shell - the primary development
    #                   platform, so a failure here breaks the person most likely
    #                   to be working.
    #
    # fail-fast is off on purpose: when a change is platform-specific, the useful
    # information is *which* platforms disagree, and cancelling the others throws
    # exactly that away.
    #
    # Every stage runs on every leg, including the three added with the `verify:ci`
    # step below, and that was costed rather than assumed. Measured against the
    # 2026-08-01 run of this workflow on `main`, the whole matrix finished in 3m05s
    # wall clock, bounded by the Windows leg; `test:scripts` is 55 tests in ~7s and
    # `check:citations` is ~2s, so the only stage with a real price is
    # `test:integration`, at roughly a minute on the slowest leg. Matrix legs run in
    # parallel, so that is ~1m of added wall clock, not three.
    #
    # `test:scripts` earns all three legs on merit: it is the suite for
    # check-portability.mjs itself, and its behaviour genuinely branches on platform
    # - symbolic links versus junctions, and a case-insensitive filesystem on two of
    # the three legs are precisely what its case-collision and symlinked-path cases
    # exist to exercise. Running the portability checker's own tests on one platform
    # would be the same mistake ADR-0002 was written about.
    #
    # `test:integration` does not earn all three on merit - it is jsdom, which has
    # no platform-dependent behaviour worth a second runner - and it is here anyway,
    # for two reasons. Carving it out would put a per-OS stage list back into this
    # file, which is the exact duplication that let three gates stop running; and
    # the shuffle seed defaults to the clock, so three legs sample three independent
    # orderings per run rather than one. A minute of parallel wall clock is a cheap
    # price for keeping the stage list unsplittable.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # node-version-file, not a literal: .nvmrc is tracked so that a laptop and
      # CI agree by construction instead of by someone remembering to edit both.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # ci, not install: installs exactly what package-lock.json pins and fails
      # if the lockfile and package.json have drifted. The tracked .npmrc sets
      # engine-strict, so this also fails outright on a Node below the floor
      # declared in package.json rather than warning and continuing.
      - name: Install dependencies
        run: npm ci

      # ONE step, calling ONE script, on purpose - and this used to be five steps
      # naming five of `verify`'s nine stages by hand.
      #
      # What that cost. `check:citations`, `test:integration` and `test:scripts`
      # were in `verify` and in no CI leg, so three gates guarded `main` only by an
      # author remembering to run them locally. `check:citations` is a 900-line gate
      # that had never once run against `main`; it caught stale documentation in
      # PR #71 only because somebody ran it by hand. The gap was not a decision
      # anyone took - it opened because a stage was added to package.json and this
      # file was not edited to match, which is the failure mode a hand-maintained
      # duplicate list has by construction. Tracked as issue #58.
      #
      # So CI no longer enumerates stages. `verify:ci` is the whole chain and
      # `verify` is defined as `verify:ci && audit:prod`, which means there is
      # exactly one ordered list of stages in the repository and CI runs it. A
      # stage added to `verify:ci` is in CI the moment it is added; a stage that
      # skipped `verify:ci` would not be in `verify` either, so it could not hide
      # from CI while still claiming to be part of the gate. Divergence is not
      # detected here, it is unrepresentable.
      #
      # What this gives up, stated rather than glossed: the per-step durations and
      # the named red step in the Actions UI. A failing stage is still named in the
      # log - npm echoes `> leapware-shellux@0.1.0 <stage>` before each one - so the
      # cost is a click, and a click is worth less than a gate that cannot silently
      # stop running. The stage order inside `verify:ci` is unchanged and still runs
      # cheapest-and-most-informative first, so a run still fails on the most
      # actionable error rather than the slowest: the mechanical half of ADR-0002
      # leads, because a portability violation invalidates every result after it.
      #
      # audit:prod is deliberately NOT here. It is the one stage of `verify` that
      # stays out of the per-push gate, because an advisory can be published with no
      # commit and a blocking per-push audit turns `main` red with no defect, no
      # author and no fix in the triggering change. It blocks on its own terms in
      # audit-dependencies.yml and audit-schedule.yml; the reasoning is in those
      # files' headers.
      - name: Verify
        run: npm run verify:ci

      # always(): the coverage report is most useful precisely when the run
      # failed, so upload it even after a failing step.
      #
      # One leg only. The report is platform-independent, and upload-artifact@v4
      # rejects a second upload under the same name, so three legs uploading
      # "coverage" would turn a green matrix red.
      - name: Upload coverage report
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 14
