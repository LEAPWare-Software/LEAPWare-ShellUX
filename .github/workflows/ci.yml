name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repository. No packages, no deployments,
# no write access to issues or PRs.
permissions:
  contents: read

# One in-flight run per ref. A new push supersedes the previous run instead of
# queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    # Three operating systems, because this project is developed on more than one
    # laptop and cross-platform support was previously *inferred* from the
    # platform-specific optional dependencies in package-lock.json rather than
    # observed. Each leg earns its place by catching something the others cannot:
    #
    #   ubuntu-latest   Case-sensitive filesystem. The only leg that fails on an
    #                   import whose case does not match the file on disk, and the
    #                   reference platform for CRLF regressions.
    #   macos-latest    The darwin-arm64 leg of the lockfile's optional
    #                   dependencies, and the only place a native rollup/esbuild
    #                   binary for that platform is actually executed rather than
    #                   assumed to exist.
    #   windows-latest  Case-insensitive filesystem, a different path separator and
    #                   a different default shell - the primary development
    #                   platform, so a failure here breaks the person most likely
    #                   to be working.
    #
    # fail-fast is off on purpose: when a change is platform-specific, the useful
    # information is *which* platforms disagree, and cancelling the others throws
    # exactly that away.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # node-version-file, not a literal: .nvmrc is tracked so that a laptop and
      # CI agree by construction instead of by someone remembering to edit both.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # ci, not install: installs exactly what package-lock.json pins and fails
      # if the lockfile and package.json have drifted. The tracked .npmrc sets
      # engine-strict, so this also fails outright on a Node below the floor
      # declared in package.json rather than warning and continuing.
      - name: Install dependencies
        run: npm ci

      # Steps are ordered cheapest and most informative first, so a run fails on
      # the most actionable error available rather than the slowest one.

      # The mechanical half of ADR-0002. First because it is the fastest step in
      # the job and because a portability violation invalidates every result after
      # it: there is no point knowing the tests pass on one machine if the tree
      # cannot be cloned onto another.
      - name: Check portability
        run: npm run check:portability

      # ---------------------------------------------------------------------
      # THE FOUR STAGES THAT USED TO RUN NOWHERE. Added deliberately, and the
      # reason is worth stating beside them rather than in a commit message.
      #
      # README.md has always claimed `npm run verify` is exactly what CI
      # applies. It was not: CI ran five of the nine stages, and the four it
      # skipped - check:citations, test:integration, test:scripts, and later
      # tokens:check - were backed only by an author ticking a box on a pull
      # request that nobody is required to review. HANDOFF.md section 5 records
      # why nobody is required to: branch protection returns 403 on this plan,
      # so the self-attestation was the entire gate.
      #
      # The gap was tracked as #58 and #58 was closed as completed while every
      # stage it named still had no leg. So this is the close, and the ordering
      # below is `verify`'s own ordering rather than a convenient one - a run
      # should fail on the same step a laptop fails on, in the same order.
      #
      # The cost, stated rather than discovered. Three of the four are node
      # scripts that finish in seconds. test:integration is not: it is roughly
      # 199 seconds, and it overlaps test:coverage because IntegrationSuite
      # runs in both. What it buys that coverage does not is `--sequence.shuffle`
      # - the only order-independence signal this project has, and #64 records
      # that it currently reaches one test file. Three legs times that duration,
      # at macOS's 10x and Windows's 2x billing, is the price of the claim in
      # README being true. Running it on one leg would buy a cheaper version of
      # the same lie.
      # ---------------------------------------------------------------------
      - name: Check citations
        run: npm run check:citations

      - name: Check tokens
        run: npm run tokens:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # The coverage gate. vitest.config.ts sets 100% statements/branches/
      # functions/lines over src/core/**; vitest exits non-zero when a threshold
      # is unmet, which fails this step and therefore the job.
      - name: Test with coverage
        run: npm run test:coverage

      - name: Integration suite (shuffled)
        run: npm run test:integration

      - name: Test the gate scripts
        run: npm run test:scripts

      - name: Build
        run: npm run build

      # always(): the coverage report is most useful precisely when the run
      # failed, so upload it even after a failing step.
      #
      # One leg only. The report is platform-independent, and upload-artifact@v4
      # rejects a second upload under the same name, so three legs uploading
      # "coverage" would turn a green matrix red.
      - name: Upload coverage report
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------------
  # The declared floor, actually executed.
  #
  # The job above reads `.nvmrc`, and so does every job in every other workflow
  # here. That is the right rule for the *development* Node: one tracked number,
  # so a laptop and CI agree by construction. But it left the `engines` lower
  # bound in package.json as the only claim in this repository that nothing ran.
  # `.nvmrc` has always named a version comfortably above the floor, so the
  # `engine-strict` setting in `.npmrc` never had anything to catch, and a
  # dependency was free to raise its own `engines` past the floor with every leg
  # staying green - while a developer on a version this project still promised to
  # support hit a hard EBADENGINE on `npm ci`. That is how the Node 20 arm came to
  # be advertised for longer than it was installable.
  #
  # This job is therefore a deliberate exception to the node-version-file rule,
  # not an oversight against it. The floor is by definition the *other* boundary
  # from the development version; it cannot be read from `.nvmrc` without `.nvmrc`
  # ceasing to mean what it means. Two files, because there are genuinely two
  # numbers.
  #
  # The literal is pinned exactly - '22.13.0', not '22'. setup-node resolves a
  # bare major to the newest release in that line, which is precisely the version
  # this job is not for.
  #
  # `npm ci` is the load-bearing step: with engine-strict it is what fails when
  # the tree's transitive `engines` data has outgrown the declared floor. `npm
  # test` follows because installing on the floor and never running on it proves
  # only half the claim.
  #
  # Cost, stated honestly: one extra job. It is ubuntu-latest and nothing else -
  # that is the 1x billing tier, where macOS bills at 10x and Windows at 2x.
  # Engine resolution is not platform-specific, and the three-OS matrix above
  # already covers what is, so a matrix here would multiply the bill to buy
  # nothing.
  # ---------------------------------------------------------------------------
  floor:
    name: Declared Node floor (22.13.0)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test
