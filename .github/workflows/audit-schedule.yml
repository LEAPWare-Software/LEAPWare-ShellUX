name: Scheduled dependency audit

# The channel that notices advisory drift.
#
# audit-dependencies.yml only runs when the dependency graph changes, so it cannot
# see an advisory published against a lockfile nobody touched. This workflow can:
# it audits the same production tree against the current advisory database once a
# week, on a timer, so a new advisory surfaces as a failing scheduled run rather
# than as a red mark on whichever unrelated commit happened to land next.
#
# A failure here is real and needs a dependency bump. It just is not anybody's
# commit's fault, and separating the two is the whole point.
on:
  schedule:
    # 07:00 UTC every Monday. A fixed weekday start-of-week slot rather than a
    # daily run: the advisory database moves daily, but a weekly cadence on a
    # pre-alpha project with nine production dependencies is enough to notice
    # something without generating a queue of runs nobody reads. UTC, and not a
    # local timezone, because the runner has no opinion about where anyone lives.
    - cron: '0 7 * * 1'
  # So the audit can be re-run on demand after a fix, without waiting a week and
  # without pushing a commit to trigger it.
  workflow_dispatch:

permissions:
  contents: read
  # To file an issue when the audit fails. Added 2026-09-18: this workflow went
  # red on six consecutive Mondays (2026-08-10 to 2026-09-14) over a high
  # advisory in js-yaml, and nobody saw it, because a failed scheduled run
  # notifies no one but the account that last edited the cron. A failure that
  # only exists on the Actions tab is exactly the "queue of runs nobody reads"
  # the header above says this workflow must not become.
  issues: write

jobs:
  audit:
    name: Audit production dependencies (scheduled)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # Identical to the blocking gate in audit-dependencies.yml and to
      # `npm run audit:prod` on a laptop, deliberately: three places that must
      # agree, all calling the one npm script that defines the threshold.
      - name: Audit production dependencies
        run: npm run audit:prod

      # The dev tree, which nothing else audits on any leg (HANDOFF section 6.2):
      # that gap is how two CVSS 9.8 criticals in vitest were structurally
      # invisible. `always()` so a production failure does not hide a dev one;
      # both are reported by the one run.
      - name: Audit all dependencies, dev tree included
        if: always()
        run: npm run audit:all

      # One open issue per failing stretch, not one per Monday: if an issue with
      # this exact title is already open, comment on it instead of opening
      # another. The run URL is the evidence; the issue is the notification.
      - name: File the failure where someone will see it
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: Scheduled dependency audit is failing
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="$ISSUE_TITLE"
          existing=$(gh issue list --state open --search "$title in:title" --json number,title             --jq "map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty")
          body="The scheduled audit failed: $RUN_URL"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
