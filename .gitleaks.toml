title = "gitleaks config — LEAPWare-ShellUX"

# Extend gitleaks' own default rule set rather than replace it (ADR-0002: this is a
# one-off invocation of a standalone binary, not a tracked dependency, so this file
# stays a thin allowlist on top of the shipped rules).
[extend]
useDefault = true

# C-19 (proof audit 2026-09-19): gitleaks' `generic-api-key` rule matches the literal
# JSON shape `key": "<identifier>"`. docs/claims.json's register rows use exactly
# that shape for every `expect` entry's field name (e.g. `"key": "pr126_medium_fixed"`,
# `"key": "d40_gate_points"`) — an expectation key, never a credential. Three such
# matches exist in the published history of `main` (commit 06ec066, the register's own
# introduction in PR A), confirmed false positives by hand.
#
# Scoped narrowly on purpose: only this one file, and only the exact
# `key": "<identifier>"` shape the rule flags — so a real secret added anywhere else
# in docs/claims.json, or under a different key spelling, still fails the scan.
[allowlist]
description = "docs/claims.json 'key' field names are register expectation keys, not secrets"
paths = ['''^docs/claims\.json$''']
regexes = ['''key":\s*"[A-Za-z0-9_.-]+"''']
